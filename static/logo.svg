<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="lumen">
  <defs>
    <linearGradient id="lumen-sun" x1="0.2" y1="0.15" x2="0.85" y2="0.9">
      <stop offset="0" stop-color="#FFC800"/>
      <stop offset="1" stop-color="#FF9500"/>
    </linearGradient>
    <radialGradient id="lumen-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.62" stop-color="#FFD84D" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFD84D" stop-opacity="0"/>
    </radialGradient>
    <filter id="lumen-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.45"/>
    </filter>
  </defs>
  <!-- paprsky -->
  <g fill="#FFC93C" filter="url(#lumen-soft)">
    <ellipse cx="50" cy="13.5" rx="1.9" ry="11.5"/>
    <ellipse cx="50" cy="13.5" rx="1.9" ry="11.5" transform="rotate(45 50 50)"/>
    <ellipse cx="50" cy="13.5" rx="1.9" ry="11.5" transform="rotate(90 50 50)"/>
    <ellipse cx="50" cy="13.5" rx="1.9" ry="11.5" transform="rotate(135 50 50)"/>
    <ellipse cx="50" cy="13.5" rx="1.9" ry="11.5" transform="rotate(180 50 50)"/>
    <ellipse cx="50" cy="13.5" rx="1.9" ry="11.5" transform="rotate(225 50 50)"/>
    <ellipse cx="50" cy="13.5" rx="1.9" ry="11.5" transform="rotate(270 50 50)"/>
    <ellipse cx="50" cy="13.5" rx="1.9" ry="11.5" transform="rotate(315 50 50)"/>
  </g>
  <!-- záře a slunce -->
  <circle cx="50" cy="50" r="27.5" fill="url(#lumen-glow)"/>
  <circle cx="50" cy="50" r="23" fill="url(#lumen-sun)"/>
  <!-- stažení -->
  <g fill="none" stroke="#FFFFFF" stroke-width="3.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 36.2V56.4"/>
    <path d="M42 48.4L50 56.4L58 48.4"/>
    <path d="M35.8 55.6V61.2A2.6 2.6 0 0 0 38.4 63.8H61.6A2.6 2.6 0 0 0 64.2 61.2V55.6"/>
  </g>
</svg>
